<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Set up Revise with AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F8FB;--sheet:#fff;--ink:#172B4D;--pencil:#5E6B80;--rule:#D5DEEA;--red:#D23B3B;--green:#1E8A5A;--hl:#FFE047;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111827;--sheet:#172033;--ink:#E7EDF7;--pencil:#9AA7BD;--rule:#2A3650;--red:#FF6B6B;--green:#4CC38A}}
:root[data-theme="dark"]{--paper:#111827;--sheet:#172033;--ink:#E7EDF7;--pencil:#9AA7BD;--rule:#2A3650;--red:#FF6B6B;--green:#4CC38A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2rem;letter-spacing:-.03em;margin:0 0 8px}
p{color:var(--pencil)}
label{display:block;font-weight:700;margin:24px 0 8px}
input{width:100%;font:inherit;color:inherit;background:var(--sheet);border:2px solid var(--rule);border-radius:10px;padding:11px 12px}
input:focus-visible{outline:3px solid #2F6FEB;outline-offset:1px}
button{margin-top:16px;font:inherit;font-weight:700;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:12px 20px;cursor:pointer}
button:disabled{opacity:.5}
.bar{height:14px;border:2px solid var(--ink);border-radius:4px;margin-top:20px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hl);transition:width .2s}
#out{margin-top:12px;font-weight:600}
.ok{color:var(--green)} .bad{color:var(--red)}
a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Set up the question bank</h1>
  <p>Creates or upgrades the database, then loads the starter bank (about 15,600 questions and 321 verified templates) in small batches. It takes a few minutes. Run it again after any update; it only adds what is missing and continues where it stopped.</p>
  <label for="tok">Admin token</label>
  <input id="tok" type="password" autocomplete="off" placeholder="The ADMIN_TOKEN you added in Cloudflare">
  <button id="go">Set up database</button>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <p id="out" aria-live="polite"></p>
</main>
<script>
const $ = id => document.getElementById(id);
const post = async (token, body) => {
  const res = await fetch('/api/setup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, ...body }) });
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error?.message || `Setup failed (${res.status}).`);
  return d;
};
const progressKey = v => 'rwa_setup_progress_v' + v;
$('go').onclick = async () => {
  const token = $('tok').value.trim(), out = $('out'), btn = $('go');
  if (!token) { out.className = 'bad'; out.textContent = 'Enter the admin token first.'; return; }
  btn.disabled = true; out.className = ''; out.textContent = 'Upgrading the database…';
  try {
    await post(token, { phase: 'schema' });
    const man = await (await fetch('/seed/manifest.json', { cache: 'no-store' })).json();
    let saved = {}; try { saved = JSON.parse(localStorage.getItem(progressKey(man.version)) || '{}'); } catch {}
    let done = 0, added = 0;
    const total = man.questions + man.templateCount;
    const show = () => { $('fill').style.width = Math.round(100 * done / total) + '%'; };
    for (const file of man.files) {
      const rows = await (await fetch('/seed/' + file)).json();
      if (saved[file]) { done += rows.length; show(); continue; }
      for (let i = 0; i < rows.length; i += 45) {
        const r = await post(token, { phase: 'rows', rows: rows.slice(i, i + 45) });
        added += r.inserted; done += Math.min(45, rows.length - i); show();
        out.textContent = `Loading questions: ${done.toLocaleString('en-IN')} of ${man.questions.toLocaleString('en-IN')} (${added.toLocaleString('en-IN')} new)…`;
      }
      saved[file] = true; try { localStorage.setItem(progressKey(man.version), JSON.stringify(saved)); } catch {}
    }
    const tpls = await (await fetch('/seed/' + man.templates)).json();
    for (let i = 0; i < tpls.length; i += 40) {
      await post(token, { phase: 'templates', templates: tpls.slice(i, i + 40) });
      done += Math.min(40, tpls.length - i); show();
      out.textContent = `Loading templates: ${Math.min(i + 40, tpls.length)} of ${tpls.length}…`;
    }
    const f = await post(token, { phase: 'finish' });
    $('fill').style.width = '100%';
    out.className = 'ok';
    out.innerHTML = `Done. ${f.questionsInBank.toLocaleString('en-IN')} questions and ${f.templates} templates are live. <a href="/">Open the site</a>`;
  } catch (e) { out.className = 'bad'; out.textContent = e.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
