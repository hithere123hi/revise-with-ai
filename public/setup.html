<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Set up Revise with AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F6F8FB;--sheet:#fff;--ink:#172B4D;--pencil:#5E6B80;--rule:#D5DEEA;--red:#D23B3B;--green:#1E8A5A;--hl:#FFE047;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#111827;--sheet:#172033;--ink:#E7EDF7;--pencil:#9AA7BD;--rule:#2A3650;--red:#FF6B6B;--green:#4CC38A}}
:root[data-theme="dark"]{--paper:#111827;--sheet:#172033;--ink:#E7EDF7;--pencil:#9AA7BD;--rule:#2A3650;--red:#FF6B6B;--green:#4CC38A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-size:17px;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2rem;letter-spacing:-.03em;margin:0 0 8px}
p{color:var(--pencil)}
label{display:block;font-weight:700;margin:24px 0 8px}
input{width:100%;font:inherit;color:inherit;background:var(--sheet);border:2px solid var(--rule);border-radius:10px;padding:11px 12px}
input:focus-visible{outline:3px solid #2F6FEB;outline-offset:1px}
button{margin-top:16px;font:inherit;font-weight:700;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:12px 20px;cursor:pointer}
button:disabled{opacity:.5}
#out{margin-top:20px;font-weight:600}
.ok{color:var(--green)} .bad{color:var(--red)}
a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Set up the question bank</h1>
  <p>Run this once after your first deploy. It creates the database tables and loads the starter questions. Running it again is safe.</p>
  <label for="tok">Admin token</label>
  <input id="tok" type="password" autocomplete="off" placeholder="The ADMIN_TOKEN you added in Cloudflare">
  <button id="go">Set up database</button>
  <p id="out" aria-live="polite"></p>
</main>
<script>
document.getElementById('go').onclick = async () => {
  const out = document.getElementById('out'), btn = document.getElementById('go');
  const token = document.getElementById('tok').value.trim();
  if (!token) { out.className = 'bad'; out.textContent = 'Enter the admin token first.'; return; }
  btn.disabled = true; out.className = ''; out.textContent = 'Creating tables…';
  let offset = 0;
  try {
    while (true) {
      const res = await fetch('/api/setup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, offset }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error?.message || 'Setup failed.');
      out.textContent = `Loading starter questions: ${Math.min(d.next, d.seedSize)} of ${d.seedSize}…`;
      if (d.done) { out.className = 'ok'; out.innerHTML = `Done. ${d.questionsInBank} questions are in the bank. <a href="/">Open the site</a>`; break; }
      offset = d.next;
    }
  } catch (e) { out.className = 'bad'; out.textContent = e.message; }
  btn.disabled = false;
};
</script>
</body>
</html>
