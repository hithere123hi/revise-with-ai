name = "revise-with-ai"
compatibility_date = "2026-09-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "revise-with-ai-db"
database_id = "b3b7dcfa-13c2-4225-b871-0d521cd189fe"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
DAILY_AI_LIMIT = "400"              # AI calls per day; keep under your free-tier daily cap
MIN_QUALITY = "6"                   # questions scoring below this (out of 10) are rejected
SUBMITS_PER_HOUR = "10"             # per visitor
MAX_VARIATIONS = "6"                # per original question
FLAGS_TO_HIDE = "3"                 # reports before a question is hidden
# GEMINI_API_KEY and ADMIN_TOKEN are secrets: add them in the Cloudflare dashboard, never here.
